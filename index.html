<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Костоправы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">

    <!-- Левая часть: название, описание механики и горы. Картинка: images/emblem.png -->
    <aside class="scene">
        <div class="scene-text">
            <div class="emblem" id="emblemBox">
                <img src="images/emblem.png" alt="Эмблема фракции" onerror="this.parentNode.hidden = true" />
            </div>
            <h1 id="title">Костоправы</h1>
            <p class="tagline" id="tagline"></p>
            <p class="description" id="description"></p>
            <p class="thanks" id="thanks"></p>
        </div>
        <svg class="mountains" viewBox="0 0 600 220" aria-hidden="true">
            <g fill="none" stroke="#8fc8ea" stroke-opacity=".14" stroke-width="1.2">
                <path d="M0 60q150-40 300 0t300 0" /><path d="M0 84q150-40 300 0t300 0" /><path d="M0 108q150-40 300 0t300 0" />
            </g>
            <path d="M0 220V120l70-50 60 34 90-80 90 84 70-46 110 90 110-60v128z" fill="#2f5f8f" />
            <path d="M0 220V150l60-40 70 46 80-56 90 60 80-44 120 64 100-40v84z" fill="#234a75" />
            <path d="M0 220v-40l90-36 90 40 110-46 100 50 90-30 120 36v46z" fill="#12253c" />
        </svg>
    </aside>

    <!-- Правая часть: поля и результат -->
    <main class="panel">
        <div class="grid">
            <div class="field">
                <label for="healthInput"><span id="healthLabel">Здоровье</span> <span class="hint" id="healthHint"></span></label>
                <div class="input-row">
                    <input type="number" id="healthInput" min="0" max="100" step="0.1" value="30" />
                    <span class="unit" id="healthUnit">%</span>
                </div>
            </div>

            <div class="field">
                <label for="heightInput" id="heightLabel">Рост</label>
                <div class="input-row">
                    <input type="number" id="heightInput" min="45" max="100" step="1" value="75" />
                    <span class="unit" id="heightUnit">%</span>
                    <span class="mode-toggle">
                        <button type="button" class="mode-btn active" id="modePercent" aria-pressed="true">%</button>
                        <button type="button" class="mode-btn" id="modeMoon" aria-pressed="false">☾</button>
                    </span>
                </div>
            </div>

            <div class="field wide">
                <label for="mouthInput"><span id="mouthLabel">Места во рту</span> <span class="hint" id="mouthHint"></span></label>
                <div class="input-row">
                    <input type="number" id="mouthInput" min="1" max="5" step="1" value="2" disabled />
                    <span class="unit" id="mouthUnit">мест</span>
                </div>
                <div class="checkbox-wrap">
                    <input type="checkbox" id="manualCheck" />
                    <label for="manualCheck" id="manualLabel">Ввести самому</label>
                </div>
            </div>
        </div>

        <button class="btn" id="calcBtn" type="button">Рассчитать</button>
        <div id="result" aria-live="polite"></div>
        <footer class="footer" id="footer"></footer>
    </main>

</div>

<!-- Порядок важен: данные -> логика -> тексты -> интерфейс -->
<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>

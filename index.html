<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Время ношения костоправов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">

    <aside class="scene">
        <div class="scene-text">
            <h1 id="title">Лечение открытых переломов</h1>
            <p class="tagline" id="tagline"></p>
            <p class="description" id="description"></p>
            <p class="thanks" id="thanks"></p>
        </div>
        <svg class="mountains" viewBox="0 0 600 220" aria-hidden="true">
            <g fill="none" stroke="#8fc8ea" stroke-opacity=".14" stroke-width="1.2">
                <path d="M0 60q150-40 300 0t300 0" /><path d="M0 84q150-40 300 0t300 0" /><path d="M0 108q150-40 300 0t300 0" />
            </g>
            <path d="M0 220V120l70-50 60 34 90-80 90 84 70-46 110 90 110-60v128z" fill="#2f5f8f" />
            <path d="M0 220V150l60-40 70 46 80-56 90 60 80-44 120 64 100-40v84z" fill="#234a75" />
            <path d="M0 220v-40l90-36 90 40 110-46 100 50 90-30 120 36v46z" fill="#12253c" />
        </svg>
    </aside>

    <main class="panel">
        <!-- Все три поля — единый формат: подпись, число + единица, необязательная подсказка под ним -->
        <div class="grid">
            <div class="field">
                <label for="healthInput" id="healthLabel">Процент переломов</label>
                <div class="input-row">
                    <input type="number" id="healthInput" min="0" max="100" step="0.1" value="30" />
                    <span class="unit" id="healthUnit">%</span>
                </div>
                <p class="hint-under" id="healthHint"></p>
            </div>

            <div class="field">
                <label for="heightInput" id="heightLabel">Рост и луны</label>
                <div class="input-row">
                    <input type="text" inputmode="decimal" id="heightInput" value="12" />
                    <!-- клик по единице переключает % / луны -->
                    <button type="button" class="unit unit-toggle" id="heightUnit" aria-label="Переключить проценты и луны" title="Нажмите, чтобы переключить проценты и луны"></button>
                </div>
                <p class="hint-under" id="heightHint"></p>
            </div>

            <div class="field">
                <label for="mouthInput" id="mouthLabel">Места во рту</label>
                <div class="input-row">
                    <input type="number" id="mouthInput" min="1" max="5" step="1" value="2" />
                    <span class="unit" id="mouthUnit">мест</span>
                </div>
                <p class="hint-under" id="mouthHint"></p>
            </div>
        </div>

        <button class="btn" id="calcBtn" type="button">Рассчитать</button>
        <div id="result" aria-live="polite"></div>
        <footer class="footer" id="footer"></footer>
    </main>

</div>
<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
